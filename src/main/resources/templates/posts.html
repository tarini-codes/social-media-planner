<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Social Media Post Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4 fw-bold text-primary">Social Media Post Planner</h2>
    <div class="row justify-content-center mb-5">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="card-title mb-3 text-secondary">Schedule New Post</h4>

                <form th:action="@{/posts}" th:object="${post}" method="post" onsubmit="return validateForm()">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="platform" class="form-label fw-semibold">Choose Platform</label>
                        <select id="platform" th:field="*{platform}" class="form-select" required>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="Twitter">Twitter</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Telegram">Telegram</option>
                            <option value="Facebook">Facebook</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="caption" class="form-label fw-semibold">Caption</label>
                        <textarea id="caption" th:field="*{caption}" class="form-control" rows="3" placeholder="Write your post content here..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="scheduledTime" class="form-label fw-semibold">Schedule Date & Time</label>
                        <input type="datetime-local" id="scheduledTime" th:field="*{scheduledTime}" class="form-control" required />
                        <div class="form-text text-muted">Select the exact date and time for automated posting.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Schedule Post</button>
                </form>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-secondary mb-0">Scheduled Posts History</h4>
                <form method="get" th:action="@{/posts}">
                    <select name="platform" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="All">All Platforms</option>
                        <option value="LinkedIn" th:selected="${selectedPlatform == 'LinkedIn'}">LinkedIn</option>
                        <option value="Twitter" th:selected="${selectedPlatform == 'Twitter'}">Twitter</option>
                        <option value="Instagram" th:selected="${selectedPlatform == 'Instagram'}">Instagram</option>
                        <option value="Telegram" th:selected="${selectedPlatform == 'Telegram'}">Telegram</option>
                        <option value="Facebook" th:selected="${selectedPlatform == 'Facebook'}">Facebook</option>
                    </select>
                </form>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Platform</th>
                                <th>Caption</th>
                                <th>Scheduled Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${posts == null or posts.empty}">
                                <td colspan="6" class="text-center py-4 text-muted">No scheduled posts found.</td>
                            </tr>
                            <tr th:each="p : ${posts}">
                                <td th:text="${p.id}">1</td>
                                <td><span class="badge bg-info text-dark" th:text="${p.platform}">LinkedIn</span></td>
                                <td th:text="${p.caption}">Sample caption...</td>
                                <td th:text="${p.formattedScheduledTime}"></td>
                                <td>
                                    <span th:class="${p.status == 'Published'} ? 'badge bg-success' : 'badge bg-warning text-dark'" th:text="${p.status}">Pending</span>
                                </td>
                                <td>
                                    <a th:if="${p.status != 'Published'}" th:href="@{/posts/publish/{id}(id=${p.id})}" class="btn btn-sm btn-outline-success me-1">Publish</a>
                                    <a th:href="@{/posts/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                                    <a th:href="@{/posts/delete/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this post?');">Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <nav aria-label="Page navigation" class="mt-3" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <link rel="stylesheet" href="">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/posts(page=${currentPage - 1}, platform=${selectedPlatform})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/posts(page=${currentPage + 1}, platform=${selectedPlatform})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script>
    function validateForm() {
        var captionInput = document.getElementById("caption").value.trim();
        if (captionInput === "") {
            alert("Please enter a caption!");
            return false;
        }
        var selectedTime = new Date(document.getElementById("scheduledTime").value);
        var currentTime = new Date();
        if (selectedTime < currentTime) {
            alert("You cannot schedule a post for a past date and time!");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
