spring.application.name=social-media-planner

spring.datasource.url=jdbc:postgresql://localhost:5432/post_scheduler_db
spring.datasource.username=postgres
spring.datasource.password=Password
spring.jpa.hibernate.ddl-auto=update

server.port=8081

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}

twitter.api.key=${TWITTER_API_KEY}
twitter.api.secret=${TWITTER_API_SECRET}
twitter.access.token=${TWITTER_ACCESS_TOKEN}
twitter.access.token.secret=${TWITTER_ACCESS_TOKEN_SECRET}

linkedin.access.token=${LINKEDIN_ACCESS_TOKEN}
linkedin.person.urn=${LINKEDIN_PERSON_URN}